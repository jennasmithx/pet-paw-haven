<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pet Paw Haven - Checkout</title>
  <link rel="icon" type="image/png" href="images/logo.png">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap');

    :root {
      --ink: #151311;
      --bone: #f5f5f5;
      --champagne: #8bb6c2;
      --champagne-dim: #8bb6c2;
      --line: rgba(21, 19, 17, 0.14);
      --error: #9c3b2e;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bone);
      color: var(--ink);
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 56px 20px 80px;
    }

    .wrap {
      width: 100%;
      max-width: 800px;
    }

    .eyebrow {
      font-family: 'Jost', sans-serif;
      font-size: 15px;
      letter-spacing: .32em;
      text-transform: uppercase;
      color: var(--champagne-dim);
      text-align: center;
      margin-bottom: 8px;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 500;
      font-size: clamp(32px, 5vw, 44px);
      text-align: center;
      margin: 0 0 20px;
      letter-spacing: .01em;
    }

    .layout {
      display: flex;
      flex-direction: column;
      gap: 0;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
    }

    .product-panel {
      background: var(--ink);
      color: var(--bone);
      padding: 22px 30px;
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .product-image {
      flex: 0 0 auto;
      max-width: 100%;
      width: 84px;
      height: 84px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(245, 245, 245, 0.15);
      background: #fff;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .product-details {
      flex: 1 1 260px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-width: 0;
      flex-wrap: wrap;
      row-gap: 8px;
    }

    .product-text {
      min-width: 0;
      flex: 1 1 auto;
    }

    .product-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 24px;
      font-style: italic;
      font-weight: 500;
      margin: 0;
      line-height: 1.3;
      color: var(--bone);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .product-sku {
      font-size: 11px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: rgba(245, 245, 245, 0.5);
      margin: 3px 0 0;
    }

    .product-side {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      gap: 8px;
    }

    .amount-block {
      text-align: right;
      min-width: 0;
    }

    .amount-block .amount {
      display: block;
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      color: var(--champagne);
      line-height: 1.1;
      white-space: nowrap;
      text-align: left;
    }

    .amount-block .amount-label {
      display: block;
      font-size: 12px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: rgba(245, 245, 245, 0.45);
      margin-top: 2px;
      text-align: right;
      white-space: normal;
      overflow-wrap: break-word;
      text-align: left;
    }

    .qty-btns {
      display: flex;
      align-items: center;
      border: 1px solid rgba(245, 245, 245, 0.25);
      border-radius: 4px;
      overflow: hidden;
      flex: 0 0 auto;
      align-self: flex-start;
    }

    .qty-btns button {
      background: none;
      border: none;
      color: var(--champagne);
      width: 32px;
      height: 32px;
      font-size: 16px;
      cursor: pointer;
    }

    .qty-btns button:hover {
      background: rgba(245, 245, 245, 0.08);
    }

    .qty-btns input {
      width: 30px;
      text-align: center;
      background: none;
      border: none;
      border-left: 1px solid rgba(245, 245, 245, 0.25);
      border-right: 1px solid rgba(245, 245, 245, 0.25);
      color: var(--bone);
      font-family: 'Jost';
      font-size: 14px;
      height: 32px;
    }

    @media(max-width:600px) {
      .product-panel {
        padding: 18px 22px;
        gap: 14px;
        align-items: flex-start;
      }

      .product-image {
        width: 120px;
        height: 120px;
        flex-shrink: 0;
      }

      .product-details {
        width: 100%;
        flex-direction: column;
        align-items: flex-start;
        justify-content: flex-start;
        gap: 10px;
        flex-wrap: nowrap;
      }

      .product-side {
        align-self: flex-start;
        margin-left: 0;
        width: auto;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: flex-start;
        gap: 8px;
      }

      .amount-block {
        width: 100%;
        text-align: left;
        align-self: flex-start;
      }

      .amount-block .amount-label {
        text-align: left;
      }

      .amount-block .amount {
        font-size: 22px;
        text-align: left;
      }
    }

    .form-panel {
      padding: 30px;
    }

    .section-label {
      font-size: 11px;
      letter-spacing: .28em;
      text-transform: uppercase;
      color: var(--ink);
      font-weight: 600;
      margin: 0 0 20px;
    }

    .section-label.second {
      margin-top: 34px;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 11px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: rgba(21, 19, 17, 0.55);
      margin-bottom: 7px;
    }

    .field input,
    .field select {
      width: 100%;
      border: none;
      border-bottom: 1px solid var(--line);
      background: transparent;
      padding: 10px 2px;
      font-family: 'Jost', sans-serif;
      font-size: 15px;
      font-weight: 400;
      color: var(--ink);
      outline: none;
      transition: border-color .2s;
    }

    .field input:focus,
    .field select:focus {
      border-bottom-color: var(--champagne);
    }

    .field.invalid input {
      border-bottom-color: var(--error);
    }

    .field .err {
      display: none;
      font-size: 11px;
      color: var(--error);
      margin-top: 5px;
    }

    .field.invalid .err {
      display: block;
    }

    .row2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media(max-width:480px) {
      .row2 {
        grid-template-columns: 1fr;
      }
    }

    .pay-btn {
      width: 100%;
      margin-top: 32px;
      padding: 17px;
      background: var(--ink);
      color: var(--bone);
      border: 1px solid var(--ink);
      border-radius: 4px;
      font-family: 'Jost', sans-serif;
      font-size: 12px;
      letter-spacing: .28em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background .25s, color .25s;
      white-space: normal;
      line-height: 1.4;
    }

    .pay-btn:hover {
      background: var(--champagne);
      border-color: var(--champagne);
    }

    .pay-btn:focus-visible {
      outline: 2px solid var(--champagne);
      outline-offset: 2px;
    }

    .pay-btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .secure-note {
      text-align: center;
      font-size: 11px;
      letter-spacing: .05em;
      color: rgba(21, 19, 17, 0.45);
      margin-top: 16px;
    }

    .secure-note svg {
      vertical-align: -2px;
      margin-right: 5px;
    }

    .form-error {
      display: none;
      text-align: center;
      font-size: 12px;
      color: var(--error);
      margin-top: 14px;
    }

    .form-error.show {
      display: block;
    }
  </style>
</head>

<body>

  <div class="wrap">
    <p class="eyebrow">Pet Paw Haven</p>
    <h1>Complete Your Order</h1>

    <form class="layout" id="checkoutForm" novalidate>

      <div class="product-panel">
        <div class="product-image">
          <img src="images/catwaterf.png" alt="Product photo">
        </div>

        <div class="product-details">
          <div class="product-text">
            <p class="product-name" id="productName">Product name</p>
            <p class="product-sku" id="productSku"></p>
          </div>

          <div class="product-side">
            <div class="qty-btns">
              <button type="button" id="qtyMinus" aria-label="Decrease quantity">&minus;</button>
              <input type="text" id="qtyValue" value="1" readonly aria-label="Quantity">
              <button type="button" id="qtyPlus" aria-label="Increase quantity">&plus;</button>
            </div>

            <div class="amount-block">
              <span class="amount" id="totalDisplay">R0.00</span>
              <span class="amount-label">Total · free shipping</span>
            </div>
          </div>
        </div>
      </div>

      <div class="form-panel">
        <p class="section-label">Contact</p>
        <div class="row2">
          <div class="field" data-field="firstName">
            <label for="firstName">First name</label>
            <input id="firstName" type="text" autocomplete="given-name">
            <div class="err">Enter your first name</div>
          </div>
          <div class="field" data-field="lastName">
            <label for="lastName">Last name</label>
            <input id="lastName" type="text" autocomplete="family-name">
            <div class="err">Enter your last name</div>
          </div>
        </div>
        <div class="field" data-field="email">
          <label for="email">Email address</label>
          <input id="email" type="email" autocomplete="email">
          <div class="err">Enter a valid email</div>
        </div>
        <div class="field" data-field="phone">
          <label for="phone">Phone number</label>
          <input id="phone" type="tel" autocomplete="tel">
          <div class="err">Enter a valid phone number</div>
        </div>

        <p class="section-label second">Shipping Address</p>
        <div class="field" data-field="address">
          <label for="address">Street address</label>
          <input id="address" type="text" autocomplete="address-line1">
          <div class="err">Enter your street address</div>
        </div>
        <div class="row2">
          <div class="field" data-field="city">
            <label for="city">City</label>
            <input id="city" type="text" autocomplete="address-level2">
            <div class="err">Enter your city</div>
          </div>
          <div class="field" data-field="postalCode">
            <label for="postalCode">Postal code</label>
            <input id="postalCode" type="text" autocomplete="postal-code">
            <div class="err">Enter your postal code</div>
          </div>
        </div>
        <div class="field" data-field="country">
          <label for="country">Country</label>
          <select id="country">
            <option value="ZA">South Africa</option>
            <option value="NA">Namibia</option>
            <option value="BW">Botswana</option>
            <option value="OTHER">Other</option>
          </select>
        </div>

        <button type="submit" class="pay-btn" id="payBtn">Pay Now — R0.00</button>
        <p class="form-error" id="formError"></p>
        <p class="secure-note">
          <svg width="11" height="13" viewBox="0 0 11 13" fill="none">
            <path d="M1 6V3.5C1 1.84 2.84 1 5.5 1C8.16 1 10 1.84 10 3.5V6M1 6H10V12H1V6Z" stroke="#151311"
              stroke-opacity="0.45" />
          </svg>
          Secure payment via PayFast
        </p>
      </div>
    </form>
  </div>

  <script type="module">
    /* ============================================================
       1. PRODUCT DATA — display only. The server (api/create-order.js)
          has its OWN copy of the price and recalculates the total
          itself. Nothing sent from this page is trusted for pricing.
          If you change the price here, change it server-side too.
       ============================================================ */
    const PRODUCT_NAME = 'Premium Cat Water Fountain';
    const PRODUCT_SKU = 'PCWF-001';
    const PRODUCT_PRICE = 650.00; // display only — server is the source of truth

    document.getElementById('productName').textContent = PRODUCT_NAME;
    document.getElementById('productSku').textContent = PRODUCT_SKU ? 'SKU ' + PRODUCT_SKU : '';

    const fmt = n => 'R' + n.toFixed(2);
    let qty = 1;

    function renderTotals() {
      const total = PRODUCT_PRICE * qty;
      document.getElementById('totalDisplay').textContent = fmt(total);
      document.getElementById('payBtn').textContent = 'Pay Now — ' + fmt(total);
    }
    renderTotals();

    document.getElementById('qtyMinus').onclick = () => { if (qty > 1) { qty--; document.getElementById('qtyValue').value = qty; renderTotals(); } };
    document.getElementById('qtyPlus').onclick = () => { qty++; document.getElementById('qtyValue').value = qty; renderTotals(); };

    /* ============================================================
       2. VALIDATION (client-side, for UX only — the server repeats
          all of this and is what actually gets trusted)
       ============================================================ */
    const form = document.getElementById('checkoutForm');
    const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    const phoneRe = /^[0-9+ ()-]{7,}$/;

    function validate() {
      let ok = true;
      const checks = {
        firstName: v => v.trim().length > 0,
        lastName: v => v.trim().length > 0,
        email: v => emailRe.test(v.trim()),
        phone: v => phoneRe.test(v.trim()),
        address: v => v.trim().length > 3,
        city: v => v.trim().length > 0,
        postalCode: v => v.trim().length > 2
      };
      for (const id in checks) {
        const input = document.getElementById(id);
        const wrap = input.closest('.field');
        const valid = checks[id](input.value);
        wrap.classList.toggle('invalid', !valid);
        if (!valid) ok = false;
      }
      return ok;
    }

    /* ============================================================
       3. SUBMIT — ask OUR server to create the order and hand back
          signed PayFast fields. We never build the PayFast form or
          the signature in the browser, and we never insert the
          order into Supabase from here — the server does both,
          using the trusted server-side price.
       ============================================================ */
    const errorEl = document.getElementById('formError');

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      errorEl.classList.remove('show');
      if (!validate()) return;

      const payBtn = document.getElementById('payBtn');
      payBtn.disabled = true;
      payBtn.textContent = 'Redirecting to PayFast…';

      try {
        const response = await fetch('/api/create-order', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            productSku: PRODUCT_SKU,
            qty,
            firstName: document.getElementById('firstName').value,
            lastName: document.getElementById('lastName').value,
            email: document.getElementById('email').value,
            phone: document.getElementById('phone').value,
            address: document.getElementById('address').value,
            city: document.getElementById('city').value,
            postalCode: document.getElementById('postalCode').value,
            country: document.getElementById('country').value
          })
        });

        if (!response.ok) {
          const err = await response.json().catch(() => ({}));
          throw new Error(err.error || 'Could not start payment. Please try again.');
        }

        const { actionUrl, fields } = await response.json();

        const payfastForm = document.createElement('form');
        payfastForm.method = 'POST';
        payfastForm.action = actionUrl;

        for (const key in fields) {
          const input = document.createElement('input');
          input.type = 'hidden';
          input.name = key;
          input.value = fields[key];
          payfastForm.appendChild(input);
        }

        document.body.appendChild(payfastForm);
        payfastForm.submit();

      } catch (err) {
        errorEl.textContent = err.message || 'Something went wrong. Please try again.';
        errorEl.classList.add('show');
        payBtn.disabled = false;
        renderTotals();
      }
    });
  </script>

</body>

</html>
