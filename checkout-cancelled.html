<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Cancelled - Pet Paw Haven</title>

<link rel="icon" type="image/png" href="images/logo.png">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root{
    --ink:#151311;
    --bone:#f5f5f5;
    --champagne:#63768b;
    --line:rgba(21,19,17,.14);
}
*{margin:0;padding:0;box-sizing:border-box;}

body{
    background:var(--bone);
    font-family:'Jost',sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:30px;
}

.card{
    background:#fff;
    border:1px solid var(--line);
    max-width:700px;
    width:100%;
    text-align:center;
    padding:70px 50px;
}

.eyebrow{
    font-size:11px;
    letter-spacing:.35em;
    text-transform:uppercase;
    color:var(--champagne);
    margin-bottom:20px;
}

.icon{
    width:90px;
    height:90px;
    margin:0 auto 30px;
    border-radius:50%;
    background:#c94d4d;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:40px;
}

h1{
    font-family:'Cormorant Garamond',serif;
    font-size:46px;
    font-weight:500;
    margin-bottom:18px;
}

p{
    color:#555;
    line-height:1.8;
    font-size:17px;
}

.btn{
    display:inline-block;
    margin-top:35px;
    padding:16px 34px;
    background:#151311;
    color:#fff;
    text-decoration:none;
    letter-spacing:.2em;
    text-transform:uppercase;
    font-size:12px;
}
</style>
</head>

<body>

<div class="card">

<div class="eyebrow">Pet Paw Haven</div>

<div class="icon">✕</div>

<h1>Payment Cancelled</h1>

<p>
Your payment was cancelled and no money has been charged.
You can return to checkout and complete your order whenever you're ready.
</p>

<a class="btn" href="index.html">Return to Store</a>

</div>

</body>
</html>
