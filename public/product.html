

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product — PetPawHaven</title>
<link rel="preconnect" href="[https://fonts.googleapis.com](https://fonts.googleapis.com)">
<link href="[https://fonts.googleapis.com/css2?family=Bricolage+Grotesque\:wght@500;600;700&family=Plus+Jakarta+Sans\:wght@400;500;600;700&display=swap](https://fonts.googleapis.com/css2?family=Bricolage+Grotesque\:wght@500;600;700\&family=Plus+Jakarta+Sans\:wght@400;500;600;700\&display=swap)" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <button class="burger-btn" id="burgerBtn" onclick="toggleMobileMenu()"><span></span><span></span><span></span></button>
  <a href="index.html" class="wordmark">Pet<span>Paw</span>Haven</a>
  <button class="cart-btn" onclick="openCart()">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
    <span class="cart-count" id="cartCount">0</span>
  </button>
</nav>
<div class="mobile-menu" id="mobileMenu">
  <a href="index.html">Home</a>
  <a href="products.html">Products</a>
  <a href="about.html">About</a>
  <a href="contact.html">Contact</a>
</div>

<div class="breadcrumb"><a href="index.html">Home</a> / <a href="products.html">Products</a> / <span id="breadcrumbName">Product</span></div>

<!-- ============================================
     PRODUCT CATALOG — add a new product here as its own entry.
     The key (e.g. "1") must match the id used in index.html's
     data-id and the real id in your database (schema.sql).
     \============================================ -->
<div id="productRoot"></div>

<footer>
  <span>© 2026 PetPawHaven. All rights reserved.</span>
  <div class="f-links">
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </div>
</footer>

<!-- CART MODAL -->
<div class="overlay" id="cartOverlay">
  <div class="modal">
    <div class="modal-head"><h3>Your Cart</h3><button class="modal-close" onclick="closeModal('cartOverlay')">&times;</button></div>
    <div class="modal-body" id="cartBody"><p class="cart-empty">Your cart is empty.</p></div>
    <div class="cart-total" id="cartTotalRow" style="display:none;"><span class="mono">Total</span><span class="amount" id="cartTotalAmount">R 0.00</span></div>
    <div class="modal-actions"><button class="btn-primary" id="checkoutBtn" onclick="openCheckout()" disabled>Checkout</button></div>
  </div>
</div>

<!-- CHECKOUT MODAL -->
<div class="overlay" id="checkoutOverlay">
  <div class="modal">
    <div class="modal-head"><h3>Checkout</h3><button class="modal-close" onclick="closeModal('checkoutOverlay')">&times;</button></div>
    <div class="modal-body">
      <div class="checkout-summary" id="checkoutSummary"></div>
      <form id="checkoutForm">
        <div class="field-row">
          <div class="field"><label>First name</label><input type="text" required></div>
          <div class="field"><label>Last name</label><input type="text" required></div>
        </div>
        <div class="field"><label>Email</label><input type="email" required></div>
        <div class="field"><label>Phone</label><input type="tel" required></div>
        <div class="field"><label>Delivery address</label><textarea rows="2" required></textarea></div>
        <div class="field-row">
          <div class="field"><label>City</label><input type="text" required></div>
          <div class="field"><label>Postal code</label><input type="text" required></div>
        </div>
      </form>
    </div>
    <div class="modal-actions">
      <button class="btn-primary" onclick="submitToPayFast()">Pay Now with PayFast</button>
      <p class="payfast-note">You'll be redirected to PayFast's secure page to complete payment. Order details are saved before you leave this site.</p>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="products-data.js"></script>
<script>
  const id = new URLSearchParams(window.location.search).get('id') || "1";
  const product = PRODUCTS[id];
  const root = document.getElementById('productRoot');

  if (!product) {
    root.innerHTML = `<div class="page-content"><h1>Product not found</h1><p>That item isn't in our current range. <a href="index.html" style="color:var(--teal-light)">Back to the shop</a>.</p></div>`;
  } else {
    document.title = `${product.name} — PetPawHaven`;
    document.getElementById('breadcrumbName').textContent = product.name;

    root.innerHTML = `
      <div class="product-detail">
        <div class="product-data" data-id="${id}" data-name="${product.name}" data-price="${product.price}">
          <div class="p-image"><img src="${product.image}" alt="${product.name}"></div>
        </div>
        <div>
          <span class="p-tag">${product.tag}</span>
          <h1>${product.name}</h1>
          <p class="desc">${product.description}</p>
          <div class="price-row">
            <span class="price">R ${product.price.toFixed(2)}</span>
            <span class="stock-badge">In stock</span>
          </div>
          <button class="hero-cta add-to-cart-btn" style="border:none; cursor:pointer;">Add to Cart</button>
          <div class="trust-row">
            <span><i class="dot"></i>Ships from South Africa</span>
            <span><i class="dot"></i>Secure checkout via PayFast</span>
            <span><i class="dot"></i>7-day return window</span>
          </div>
        </div>
      </div>
    `;

    // Wire up Add to Cart now that the product markup exists
    const card = root.querySelector('.product-data');
    const btn = root.querySelector('.add-to-cart-btn');
    btn.addEventListener('click', () => addToCart(getProductFromCard(card)));
  }
</script>
<script src="cart.js"></script>
</body>
</html>
