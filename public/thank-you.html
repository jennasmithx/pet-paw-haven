<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pet Paw Haven - Thank You</title>
<link rel="icon" type="image/png" href="images/logo.png">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root{
    --ink:#151311;
    --bone:#f5f5f5;
    --champagne:#63768b;
    --line:rgba(21,19,17,.14);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:var(--bone);
    color:var(--ink);
    font-family:'Jost',sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:30px;
}

.card{
    width:100%;
    max-width:700px;
    background:#fff;
    border:1px solid var(--line);
    padding:70px 50px;
    text-align:center;
}

.eyebrow{
    font-size:11px;
    letter-spacing:.35em;
    text-transform:uppercase;
    color:var(--champagne);
    margin-bottom:18px;
}

.check{
    width:90px;
    height:90px;
    border-radius:50%;
    background:var(--champagne);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:42px;
    margin:0 auto 30px;
}

h1{
    font-family:'Cormorant Garamond',serif;
    font-size:48px;
    font-weight:500;
    margin-bottom:18px;
}

p{
    font-size:17px;
    color:#555;
    line-height:1.8;
    max-width:500px;
    margin:0 auto;
}

.redirect{
    margin-top:40px;
    font-size:13px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--champagne);
}

.home-btn{
    display:inline-block;
    margin-top:35px;
    padding:16px 34px;
    background:var(--ink);
    color:var(--bone);
    text-decoration:none;
    letter-spacing:.2em;
    text-transform:uppercase;
    font-size:12px;
    transition:.25s;
}

.home-btn:hover{
    background:#000;
}
</style>
</head>

<body>

<div class="card">

    <div class="eyebrow">Pet Paw Haven</div>

    <div class="check">✓</div>

    <h1>Thank You!</h1>

    <p>
        Your order has been received successfully.
        We've sent your order for processing and you'll receive an email confirmation shortly.
    </p>

    <a href="index.html" class="home-btn">Continue Shopping</a>

    <div class="redirect">
        Redirecting to the homepage in
        <span id="countdown">5</span> seconds...
    </div>

</div>

<script>
let seconds = 5;

const countdown = document.getElementById("countdown");

const timer = setInterval(() => {
    seconds--;
    countdown.textContent = seconds;

    if(seconds <= 0){
        clearInterval(timer);
        window.location.href = "index.html";
    }
},1000);
</script>

<script>
(async function checkOrderStatus() {
  const params = new URLSearchParams(window.location.search);
  const ref = params.get('ref');
  const messageEl = document.getElementById('orderStatusMessage');

  if (!ref) {
    if (messageEl) messageEl.textContent = "We couldn't find that order.";
    return;
  }

  try {
    const res = await fetch(`/api/order-status?ref=${encodeURIComponent(ref)}`);
    const data = await res.json();

    if (!messageEl) return;

    if (data.status === 'Paid') {
      messageEl.textContent = 'Your order is confirmed! Thank you for shopping with PetPawHaven.';
    } else if (data.status === 'Pending') {
      // PayFast can take a few seconds to send the webhook after redirecting
      // the browser here, so poll briefly before giving up.
      messageEl.textContent = 'Confirming your payment…';
      setTimeout(checkOrderStatus, 3000);
    } else {
      messageEl.textContent = "We couldn't confirm this payment. If you were charged, please contact us with your order reference: " + ref;
    }
  } catch (err) {
    if (messageEl) messageEl.textContent = "We couldn't confirm this order right now. Please contact us with your order reference: " + ref;
  }
})();
</script>

</body>
</html>
